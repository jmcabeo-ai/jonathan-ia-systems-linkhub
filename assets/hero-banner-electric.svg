  <rect x="0" y="0" width="18" height="520" fill="#00d8ff"/>
  <rect x="18" y="0" width="14" height="520" fill="#075bff"/>
  <rect x="1568" y="0" width="14" height="520" fill="#075bff"/>
  <rect x="1582" y="0" width="18" height="520" fill="#00d8ff"/>
